# Render blueprint, free setup: one free web service. The database is a free Neon Postgres
# (neon.tech); paste its connection string into DATABASE_URL. See DEPLOY.md.
# Free web services sleep after 15 minutes without visitors; the first visit after that takes ~1 minute.
services:
  - type: web
    name: coldmail
    runtime: node
    plan: free
    branch: product
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL       # from Neon: Connection string (with ?sslmode=require)
        sync: false
      - key: APP_URL            # e.g. https://coldmail-xxxx.onrender.com, no trailing slash
        sync: false
      - key: ALLOWED_EMAILS     # comma-separated; only these people can sign in (empty = anyone)
        sync: false
      - key: ADMIN_EMAILS       # comma-separated; no monthly search limit
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY  # leave empty until you add credit; searches stay off without it
        sync: false
      - key: HUNTER_API_KEY
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: MONTHLY_RUN_LIMIT
        value: "3"
      - key: DAILY_SEND_LIMIT
        value: "50"
      - key: MAX_CONCURRENT_RUNS
        value: "2"
